services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ..:/workspaces/hovedopgave-skilteplanen:cached
      - type: volume
        source: root-node-modules
        target: /workspaces/hovedopgave-skilteplanen/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api-node-modules
        target: /workspaces/hovedopgave-skilteplanen/apps/api/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspaces/hovedopgave-skilteplanen/apps/web/node_modules
        volume:
          nocopy: true
    command: sleep infinity
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb
    restart: unless-stopped
    ports:
      - 8081:8081
    env_file:
      - .env
    environment:
      - PGWEB_DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  root-node-modules:
  api-node-modules:
  web-node-modules:
