services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ..:/workspaces/hovedopgave-skilteplanen:cached
      - type: volume
        source: root-node-modules
        target: /workspaces/hovedopgave-skilteplanen/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api-node-modules
        target: /workspaces/hovedopgave-skilteplanen/apps/api/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web-node-modules
        target: /workspaces/hovedopgave-skilteplanen/apps/web/node_modules
        volume:
          nocopy: true
    command: sleep infinity
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "5173:5173"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - PGWEB_DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
    ports:
    - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
  keycloak-db:
    container_name: keycloak-db
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  keycloak-pgdata:
  root-node-modules:
  api-node-modules:
  web-node-modules: