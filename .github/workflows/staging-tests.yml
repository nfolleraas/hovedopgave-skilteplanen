name: Staging tests

on:
  pull_request:
    branches: [Staging]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run --filter web test

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        env:
          # Prisma reads this during generation. The unit tests mock the database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: bun run db:generate
      - name: Test the road permit repository, controller, and service
        working-directory: apps/api
        run: >-
          bun run test
          src/modules/road-permit/road-permit.repository.spec.ts
          src/modules/road-permit/road-permit.controller.spec.ts
          src/modules/road-permit/road-permit.service.spec.ts
