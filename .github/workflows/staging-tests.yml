name: Staging tests

on:
  pull_request:
    branches: [Staging]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [Staging]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/playwright
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d playwright"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run --filter web build
      - name: Run frontend unit tests
        working-directory: apps/web
        run: bun run test:unit
      - name: Prepare the Playwright database
        working-directory: apps/api
        run: |
          bun run db:generate
          bun run db:deploy
      - name: Test permit transactions against PostgreSQL
        working-directory: apps/api
        run: ROAD_PERMIT_TEST_DATABASE_URL="$DATABASE_URL" bun run test:e2e test/road-permit.database.e2e-spec.ts
      - name: Install Chromium
        working-directory: apps/web
        run: bun run playwright install --with-deps chromium
      - name: Run road-permit end-to-end tests
        working-directory: apps/web
        run: bun run test:e2e

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        env:
          # Prisma reads this during generation. The unit tests mock the database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: bun run db:generate
      - name: Run API unit tests
        working-directory: apps/api
        run: bun run test
      - name: Run API end-to-end tests
        working-directory: apps/api
        run: bun run test:e2e

  deploy:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/Staging'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check that the tested commit is still current
        id: commit
        shell: bash
        run: |
          staging_ref="$(git ls-remote --exit-code origin refs/heads/Staging)"
          if [[ "${staging_ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "A newer commit has reached Staging. Skipping $GITHUB_SHA."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Connect to Coolify over Tailscale
        if: steps.commit.outputs.current == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:staging-deploy
      - name: Deploy and verify both applications
        if: steps.commit.outputs.current == 'true'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_BACKEND_UUID: ${{ vars.COOLIFY_BACKEND_UUID }}
          COOLIFY_FRONTEND_UUID: ${{ vars.COOLIFY_FRONTEND_UUID }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash .github/scripts/deploy-staging.sh
