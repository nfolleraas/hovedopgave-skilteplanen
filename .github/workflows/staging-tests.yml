name: Staging tests

on:
  pull_request:
    branches: [Staging]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/playwright
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d playwright"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # The web app imports the enums Prisma generates in apps/api.
      - name: Generate the Prisma client
        working-directory: apps/api
        run: bun run db:generate
      - name: Build frontend
        working-directory: apps/web
        run: bun run build
      - name: Run frontend unit tests
        working-directory: apps/web
        run: bun run test:unit
      - name: Prepare the Playwright database
        working-directory: apps/api
        run: |
          bun run db:deploy
          bun run db:seed
      - name: Install Chromium
        working-directory: apps/web
        run: bun run playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: apps/web
        run: bun run test:e2e
      - name: Run Biome checks
        run: bun run check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Build API
        working-directory: apps/api
        env:
          # Prisma reads this during generation. The unit tests mock the database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: bun run build
      - name: Run API unit tests
        working-directory: apps/api
        run: bun run test
      - name: Run API integration tests
        working-directory: apps/api
        run: bun run test:api
